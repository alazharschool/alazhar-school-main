<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="#5a2600" stroke="#e8b007" stroke-width="4"/>
  
  <!-- Quran Book Shape -->
  <rect x="40" y="50" width="120" height="100" rx="5" fill="#e8b007" stroke="#5a2600" stroke-width="3"/>
  
  <!-- Book Spine -->
  <rect x="95" y="50" width="10" height="100" fill="#5a2600"/>
  
  <!-- Decorative Lines on Book -->
  <line x1="50" y1="70" x2="90" y2="70" stroke="#5a2600" stroke-width="2"/>
  <line x1="50" y1="85" x2="90" y2="85" stroke="#5a2600" stroke-width="2"/>
  <line x1="50" y1="100" x2="90" y2="100" stroke="#5a2600" stroke-width="2"/>
  <line x1="50" y1="115" x2="90" y2="115" stroke="#5a2600" stroke-width="2"/>
  
  <line x1="110" y1="70" x2="150" y2="70" stroke="#5a2600" stroke-width="2"/>
  <line x1="110" y1="85" x2="150" y2="85" stroke="#5a2600" stroke-width="2"/>
  <line x1="110" y1="100" x2="150" y2="100" stroke="#5a2600" stroke-width="2"/>
  <line x1="110" y1="115" x2="150" y2="115" stroke="#5a2600" stroke-width="2"/>
  
  <!-- Crescent Moon -->
  <path d="M100 25 Q115 25 125 35 Q115 45 100 45 Q90 40 90 35 Q90 30 100 25" fill="#e8b007" stroke="#5a2600" stroke-width="2"/>
  
  <!-- Star -->
  <polygon points="100,20 102,26 108,26 103,30 105,36 100,32 95,36 97,30 92,26 98,26" fill="#e8b007" stroke="#5a2600" stroke-width="1"/>
  
  <!-- Text "AL-AZHAR" -->
  <text x="100" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="#e8b007">AL-AZHAR</text>
</svg>
